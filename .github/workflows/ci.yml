name: Java CI with Maven & Docker

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Maven Build & JUnit 5 Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blackjack
          POSTGRES_USER: ci_user
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit Tests & Package JAR
        env:
          DB_URL: jdbc:postgresql://localhost:5432/blackjack
          DB_USER: ci_user
        run: mvn -B clean package

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: target/surefire-reports/

  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: blackjack-trainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
