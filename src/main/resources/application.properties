spring.main.headless=false
spring.application.name=blackjack-trainer
logging.level.root=INFO

# Import variables from local .env file (if present)
spring.config.import=optional:file:.env[.properties],optional:file:Blackjack-Practise/.env[.properties]

# PostgreSQL Database Configuration (Populated from .env or system environment variables)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Allow the app to launch even if PostgreSQL is offline or credentials need adjustment
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
